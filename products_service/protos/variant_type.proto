syntax = "proto3";

package variant_type_proto;

option go_package = "./generated_protos/variant_type_proto";

service VariantTypeService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message VariantType {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  string name = 4;
}

message CreateRequest {
  string name = 1;
  
}

message CreateResponse {
  VariantType varianttype = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  VariantType varianttype = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional string name = 2;
}

message UpdateResponse {
  VariantType varianttype = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional string name = 3;
  optional bool include_deleted = 4;
  optional OrderBy orderby = 5;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated VariantType rows = 1;
  uint32 count = 2;
}
