syntax = "proto3";

package product_has_image_proto;

option go_package = "./generated_protos/product_has_image_proto";

service ProductHasImageService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ProductHasImage {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 products_id = 4;
  uint32 images_id = 5;
  uint32 priority = 6;

}

message CreateRequest {
  uint32 products_id = 1;
  uint32 images_id = 2;
  uint32 priority = 3;
}

message CreateResponse {
  ProductHasImage producthasimage = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  ProductHasImage producthasimage = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 products_id = 2;
  optional uint32 images_id = 3;
  optional uint32 priority = 4;
}

message UpdateResponse {
  ProductHasImage producthasimage = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 images_id = 3;
  optional uint32 products_id = 4;
  optional uint32 priority = 5;
  optional bool include_deleted = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ProductHasImage rows = 1;
  uint32 count = 2;
}
