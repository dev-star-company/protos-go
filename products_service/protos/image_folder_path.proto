syntax = "proto3";

package image_folder_path_proto;

option go_package = "./generated_protos/image_folder_path_proto";

service ImageFolderPathService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ImageFolderPath {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 image_folder_source_id = 4;
}

message CreateRequest {
  uint32 image_folder_source_id = 1;
  
}

message CreateResponse {
  uint32 image_folder_source_id = 1;
  string created_at = 2;
  string deleted_at = 3;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 image_folder_source_id = 1;
  string created_at = 2;
  string deleted_at = 3;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 image_folder_source_id = 2;
}

message UpdateResponse {
  uint32 image_folder_source_id = 1;
  string created_at = 2;
  string deleted_at = 3;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 image_folder_source_id = 3;
  optional bool include_deleted = 4;
  optional OrderBy orderby = 5;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ImageFolderPath rows = 1;
  uint32 count = 2;
}
