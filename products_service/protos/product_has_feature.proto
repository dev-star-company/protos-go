syntax = "proto3";

package product_has_feature_proto;

option go_package = "./generated_protos/product_has_feature_proto";

service ProductHasFeatureService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ProductHasFeature {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 features_id = 4;
  uint32 products_id = 5;
}

message CreateRequest {
  uint32 features_id = 1;
  uint32 products_id = 2;
}

message CreateResponse {
  ProductHasFeature producthasfeature = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  ProductHasFeature producthasfeature = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 features_id = 2;
  optional uint32 products_id = 3;
}

message UpdateResponse {
  ProductHasFeature producthasfeature = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 features_id = 3;
  optional uint32 products_id = 4;
  optional bool include_deleted = 5;
  optional OrderBy orderby = 6;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ProductHasFeature rows = 1;
  uint32 count = 2;
}
