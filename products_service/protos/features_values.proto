syntax = "proto3";

package features_values_proto;

option go_package = "./generated_protos/features_values_proto";

service FeaturesValuesService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message FeaturesValues {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 feature_id = 4;
  uint32 feature_unit_values_id = 5;
  optional uint32 feature_values_id = 6;
  string value = 7;
}

message CreateRequest {
  uint32 feature_id = 1;
  uint32 feature_unit_values_id = 2;
  string value = 3;
}

message CreateResponse {
  uint32 feature_id = 1;
  uint32 feature_unit_values_id = 2;
  string value = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 feature_id = 1;
  uint32 feature_unit_values_id = 2;
  string value = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 feature_id = 2;
  optional uint32 feature_unit_values_id = 3;
  optional string value = 4;
}

message UpdateResponse {
  uint32 feature_id = 1;
  uint32 feature_unit_values_id = 2;
  string value = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  uint32 feature_id = 3;
  uint32 feature_unit_values_id = 4;
  optional string value = 5;
  optional bool include_deleted = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated FeaturesValues rows = 1;
  uint32 count = 2;
}
