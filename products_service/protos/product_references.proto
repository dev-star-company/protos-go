syntax = "proto3";

package product_references_proto;

option go_package = "./generated_protos/product_references_proto";

service ProductReferencesService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ProductReferences {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 reference_source_id = 4;
  string value = 5;

}

message CreateRequest {
  uint32 reference_source_id = 1;
  string value = 2;
}

message CreateResponse {
  ProductReferences productreferences = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  ProductReferences productreferences = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 reference_source_id = 2;
  optional string value = 3;
}

message UpdateResponse {
  ProductReferences productreferences = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional string value = 3;
  optional uint32 reference_source_id = 4;
  optional bool include_deleted = 5;
  optional OrderBy orderby = 6;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ProductReferences rows = 1;
  uint32 count = 2;
}
