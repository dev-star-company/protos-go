syntax = "proto3";

package product_prices_proto;

option go_package = "./generated_protos/product_prices_proto";

service ProductPricesService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ProductPrices {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 price_type_id = 4;
  uint32 products_id = 5;
  double default_value = 6;
  optional double min_value = 7;

}

message CreateRequest {
  uint32 price_type_id = 1;
  uint32 products_id = 2;
  double default_value = 3;
  optional double min_value = 4;
}

message CreateResponse {
  ProductPrices productprices = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  ProductPrices productprices = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 price_type_id = 2;
  optional uint32 products_id = 3;
  optional double default_value = 4;
  optional double min_value = 5;
}

message UpdateResponse {
  ProductPrices productprices = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 products_id = 3;
  optional uint32 price_type_id = 4;
  optional double default_value = 5;
  optional double min_value = 6;
  optional bool include_deleted = 7;
  optional OrderBy orderby = 8;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ProductPrices rows = 1;
  uint32 count = 2;
}
