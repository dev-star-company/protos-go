syntax = "proto3";

package promotion_has_product_proto;

option go_package = "./generated_protos/promotion_has_product_proto";

service PromotionHasProductService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message PromotionHasProduct {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 products_id = 4;
  uint32 promotion_id = 5;
  double promocional_price = 6;

}

message CreateRequest {
  uint32 products_id = 1;
  uint32 promotion_id = 2;
  double promocional_price = 3;
}

message CreateResponse {
  uint32 products_id = 1;
  uint32 promotion_id = 2;
  double promocional_price = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 products_id = 1;
  uint32 promotion_id = 2;
  double promocional_price = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 products_id = 2;
  optional uint32 promotion_id = 3;
  optional double promocional_price = 4;
}

message UpdateResponse {
  uint32 products_id = 1;
  uint32 promotion_id = 2;
  double promocional_price = 3;
  string created_at = 4;
  string deleted_at = 5;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 promotion_id = 3;
  optional uint32 products_id = 4;
  optional double promocional_price = 5;
  optional bool include_deleted = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated PromotionHasProduct rows = 1;
  uint32 count = 2;
}
