syntax = "proto3";

package image_folder_source_proto;

option go_package = "./generated_protos/image_folder_source_proto";

service ImageFolderSourceService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ImageFolderSource {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  string name = 4;
  string base_url = 5;
  optional string acess_key = 6;
  optional string secret_key = 7;
}

message CreateRequest {
  string name = 1;
  string base_url = 2;
  optional string acess_key = 3;
  optional string secret_key = 4;
  
}

message CreateResponse {
  ImageFolderSource imagefoldersource = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  ImageFolderSource imagefoldersource = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional string name = 2;
  optional string base_url = 3;
  optional string acess_key = 4;
  optional string secret_key = 5;
}

message UpdateResponse {
  ImageFolderSource imagefoldersource = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional string name = 3;
  optional string base_url = 4;
  optional string acess_key = 5;
  optional string secret_key = 6;
  optional bool include_deleted = 7;
  optional OrderBy orderby = 8;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated ImageFolderSource rows = 1;
  uint32 count = 2;
}
