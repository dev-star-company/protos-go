syntax = "proto3";

package products_proto;

option go_package = "./generated_protos/products_proto";

service ProductsService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Products {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  optional uint32 category_id = 4;
  optional uint32 brand_id = 5;
  optional uint32 variant_type_id = 6;
  optional uint32 product_references_id = 7;
  optional uint32 image_id = 8;
  string name = 9;
  uint32 stock = 10;
}

message CreateRequest {
  optional uint32 category_id = 1;
  optional uint32 brand_id = 2;
  optional uint32 variant_type_id = 3;
  optional uint32 product_references_id = 4;
  optional uint32 image_id = 5;
  string name = 6;
  uint32 stock = 7;
  
}

message CreateResponse {
  Products products = 1;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  Products products = 1;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 category_id = 2;
  optional uint32 brand_id = 3;
  optional uint32 variant_type_id = 4;
  optional uint32 product_references_id = 5;
  optional uint32 image_id = 6;
  optional string name = 7;
  optional uint32 stock = 8;
}

message UpdateResponse {
  Products products = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 category_id = 3;
  optional uint32 brand_id = 4;
  optional uint32 variant_type_id = 5;
  optional uint32 product_references_id = 6;
  optional uint32 image_id = 7;
  optional string name = 8;
  optional uint32 stock = 9;
  optional bool include_deleted = 10;
  optional OrderBy orderby = 11;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated Products rows = 1;
  uint32 count = 2;
}
