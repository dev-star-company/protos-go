syntax = "proto3";

package images_proto;

option go_package = "./generated_protos/images_proto";

service ImagesService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Images {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 3;
  uint32 media_type_id = 4;
  string name = 5;
  uint32 folder_id = 6;
  string cloudflare_id = 7;
  string url = 8;
  int64 size = 9;
  string content_type = 10;
}

message CreateRequest {
  uint32 media_type_id = 1;
  string name = 2;
  uint32 folder_id = 3;
  bytes image_data = 4;
  string content_type = 5;
}

message CreateResponse {
  uint32 id = 1;
  uint32 media_type_id = 2;
  string name = 3;
  uint32 folder_id = 4;
  string cloudflare_id = 5;
  string url = 6;
  int64 size = 7;
  string content_type = 8;
  string created_at = 9;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 id = 1;
  uint32 media_type_id = 2;
  string name = 3;
  uint32 folder_id = 4;
  string cloudflare_id = 5;
  string url = 6;
  int64 size = 7;
  string content_type = 8;
  string created_at = 9;
  optional string deleted_at = 10;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 media_type_id = 2;
  optional string name = 3;
  optional uint32 folder_id = 4;
  optional bytes image_data = 5;
  optional string content_type = 6;
}

message UpdateResponse {
  uint32 id = 1;
  uint32 media_type_id = 2;
  string name = 3;
  uint32 folder_id = 4;
  string cloudflare_id = 5;
  string url = 6;
  int64 size = 7;
  string content_type = 8;
  string created_at = 9;
  optional string deleted_at = 10;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 media_type_id = 3;
  optional string name = 4;
  optional uint32 folder_id = 5;
  optional string cloudflare_id = 6;
  optional bool include_deleted = 7;
  optional OrderBy orderby = 8;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated Images rows = 1;
  uint32 count = 2;
}
