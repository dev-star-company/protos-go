syntax = "proto3";

package folders_proto;

option go_package = "./generated_protos/folders_proto";

service FoldersService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Folders {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 4;
  uint32 folder_id = 8;
  uint32 host_urls_id = 9;
  string name = 10;
}

message CreateRequest {
  uint32 folder_id = 2;
  uint32 host_urls_id = 3;
  string name = 4;
  
}

message CreateResponse {
  uint32 folder_id = 2;
  uint32 host_urls_id = 3;
  string name = 4;
  string created_at = 5;
  string deleted_at = 7;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 folder_id = 2;
  uint32 host_urls_id = 3;
  string name = 4;
  string created_at = 5;
  string deleted_at = 7;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 folder_id = 3;
  uint32 host_urls_id = 4;
  string name = 5;
}

message UpdateResponse {
  uint32 folder_id = 2;
  uint32 host_urls_id = 3;
  string name = 4;
  string created_at = 5;
  string deleted_at = 7;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional uint32 folder_id = 3;
  uint32 host_urls_id = 4;
  string name = 5;
  optional bool include_deleted = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated Folders rows = 1;
  uint32 count = 2;
}
