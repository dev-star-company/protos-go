syntax = "proto3";

package first_login_proto;

option go_package = "./generated_protos/first_login_proto";

service FirstLoginService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Get (GetRequest) returns (GetResponse);
}

message FirstLogin {
    uint32 id = 1;
    string created_at = 2;
    optional string deleted_at = 4;
    string user_id = 8;
    bool successful = 9;
}

message CreateRequest {
    string user_id = 1;
    bool successful = 2;
}

message CreateResponse {
    string user_id = 1;
    bool successful = 2;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message GetRequest {
    uint32 id = 1;
    uint32 limit = 3;
    uint32 offset = 4;
}

message GetResponse {
    string user_id = 1;
    bool successful = 2;
}


message ListRequest {
    optional uint32 limit = 1;
    optional uint32 offset = 2;
    optional bool include_deleted = 3;
    optional OrderBy order_by = 4;
    optional string user_id = 5;
    optional bool successful = 6;
}

message OrderBy {
    optional string id = 1;
    optional string created_at = 2;
}

message ListResponse {
    repeated FirstLogin rows = 1;
    uint32 count = 2;
}

message UpdateRequest {
    uint32 id = 1;
    optional string user_id = 2;
    optional bool successful = 3;
}

message UpdateResponse {
    string user_id = 1;
    bool successful = 2;
}