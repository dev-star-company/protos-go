syntax = "proto3";

package user_has_roles_proto;

option go_package = "./generated_protos/user_has_roles_proto";

service UserHasRolesService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Get (GetRequest) returns (GetResponse);
}

message UserHasRoles {
    uint32 id = 1;
    string created_at = 2;
    optional string deleted_at = 3;
    uint32 role_id = 4;
    uint32 user_id = 5;
}

message CreateRequest {
    uint32 role_id = 1;
    uint32 user_id = 2;
}

message CreateResponse {
    uint32 role_id = 1;
    uint32 user_id = 2;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message GetRequest {
    uint32 id = 1;
}

message GetResponse {
    uint32 role_id = 2;
    uint32 user_id = 3;
}

message ListRequest {
    optional uint32 limit = 4;
    optional uint32 offset = 5;
    optional bool include_deleted = 6;
    optional OrderBy order_by = 7;
    optional uint32 role_id = 8;
    optional uint32 user_id = 9;
}

message OrderBy {
    optional string id = 10;
    optional string created_at = 11;
}

message ListResponse {
    repeated UserHasRoles rows = 12;
    uint32 count = 13;
}

message UpdateRequest {
    uint32 id = 14;
    optional uint32 role_id = 15;
    optional uint32 user_id = 16;
}

message UpdateResponse {
    uint32 role_id = 17;
    uint32 user_id = 18;
}