syntax = "proto3";

package service_proto;

option go_package = "./generated_protos/service_proto";

service ServiceService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Get (GetRequest) returns (GetResponse);
}

message ServiceDto {
    uint32 id = 1;
    string created_at = 2;
    optional string deleted_at = 4;
    string name = 8;
    bool is_active = 9;
    string description = 10;
    string internal_name = 11;
}

message CreateRequest {
    string name = 1;
    string description = 3;
    string internal_name = 4;
}

message CreateResponse {
    string name = 1;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message GetRequest {
    uint32 id = 1;
    uint32 limit = 3;
    uint32 offset = 4;
}

message GetResponse {
    string name = 1;
}

message ListRequest {
    optional uint32 limit = 1;
    optional uint32 offset = 2;
    optional bool include_deleted = 3;
    optional string name = 4;
    optional OrderBy order_by = 5;
    optional string description = 6;
    optional string internal_name = 7;
}

message OrderBy {
    optional string id = 1;
    optional string created_at = 2;
}

message ListResponse {
    repeated ServiceDto rows = 1;
    uint32 count = 2;
}

message UpdateRequest {
    uint32 id = 1;
    optional string name = 2;
}

message UpdateResponse {
    string name = 1;
}