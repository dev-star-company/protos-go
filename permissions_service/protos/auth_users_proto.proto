syntax = "proto3";

package auth_users_proto;

option go_package = "./generated_protos/auth_users_proto";

service AuthUsersService {
  rpc Create (CreateRequest) returns (CreateResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc List (ListRequest) returns (ListResponse);
  rpc Update (UpdateRequest) returns (UpdateResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc GetUserRoles (GetUserByRolesRequest) returns (GetUserByRolesResponse);

  rpc VerifyPassword (VerifyPasswordRequest) returns (VerifyPasswordResponse);
}

message Phone {
  uint32 id = 1;
  string phone = 2;
  string created_at = 3;
  optional string deleted_at = 5;
  bool main = 9;
  string uuid = 10;
}

message Email {
  uint32 id = 1;
  string email = 2;
  string created_at = 3;
  optional string deleted_at = 5;
  bool main = 9;
  string uuid = 10;
}

message User {
  uint32 id = 1;
  string name = 2;
  string surname = 3;
  repeated Email emails = 4;
  string created_at = 5;
  optional string deleted_at = 7;
  repeated Phone phones = 12;
  string uuid = 13;
}

message Relations {
  bool emails = 1;
  bool phones = 2;
  bool passwords = 3;
  bool roles = 4;
}

message Password {
  uint32 id = 1;
  string password = 2;
  string created_at = 3;
  optional string deleted_at = 5;
}

message CreateRequest {
  string name = 2;
  string surname = 3;
  string email = 4;
  string password = 5;
  string confirm_password = 6;
  string phone = 7;
}

message CreateResponse {
  User user = 1;
}

message GetRequest {
  string uuid = 1;
}

message GetResponse {
  User user = 1;
}

message GetUserByRolesRequest {
    uint32 id = 1;
}

message GetUserByRolesResponse {
    repeated uint32 roles_ids = 1;
}

message ListRequest {
  optional uint32 id = 1;
  optional string email = 2;
  optional string name = 3;
  optional string surname = 4;
  optional uint32 limit = 5;
  optional uint32 offset = 6;
  optional bool include_deleted = 7;
  optional string phone = 8;
  optional Relations relations = 9;
}

message ListResponse {
  uint32 count = 1;
  repeated User rows = 2;
}

message UpdateRequest {
  optional uint32 id = 2;
  optional string name = 3;
  optional string surname = 4;
  optional string email = 5;
  optional string password = 6;
  optional string confirm_password = 7;
  optional string phone = 8;
  optional string uuid = 9;
}

message UpdateResponse {
  User user = 1;
}

message DeleteRequest {
  uint32 id = 2;
}

message DeleteResponse {}

message VerifyPasswordRequest {
  optional string uuid = 1;
  string password = 2;
  optional string email = 4;
  optional string phone = 5;
}

message VerifyPasswordResponse {
  bool success = 1;
  optional uint32 remaining_retries = 2;
  optional string suspended_until = 4;
  optional User user = 5;
}