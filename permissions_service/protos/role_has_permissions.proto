syntax = "proto3";

package role_has_permissions_proto;

option go_package = "./generated_protos/role_has_permissions_proto";

service RoleHasPermissionService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Get (GetRequest) returns (GetResponse);
}

message RoleHasPermissions {
    uint32 id = 1;
    string created_at = 2;
    optional string deleted_at = 3;
    uint32 role_id = 4;
    uint32 permission_id = 5;
    Permission permission = 6;
}

message Permission {
    string name = 1;
    string description = 2;
    string internal_name = 3;
}

message CreateRequest {
    uint32 role_id = 1;
    uint32 permission_id = 2;
}

message CreateResponse {
    uint32 role_id = 1;
    uint32 permission_id = 2;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message GetRequest {
    uint32 id = 1;
    uint32 limit = 2;
    uint32 offset = 3;
}

message GetResponse {
    uint32 role_id = 4;
    uint32 permission_id = 5;
}

message ListRequest {
    optional uint32 role_id = 1;
    optional uint32 permission_id = 2;
    optional uint32 limit = 6;
    optional uint32 offset = 7;
    optional bool include_deleted = 8;
    optional OrderBy order_by = 9;
}

message OrderBy {
    optional string id = 10;
    optional string created_at = 11;
}

message ListResponse {
    repeated RoleHasPermissions rows = 1;
    uint32 count = 2;
}

message UpdateRequest {
    uint32 id = 14;
    optional uint32 role_id = 15;
    optional uint32 permission_id = 16;
}

message UpdateResponse {
    uint32 role_id = 17;
    uint32 permission_id = 18;
}