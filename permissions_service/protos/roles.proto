syntax = "proto3";

package roles_proto;

option go_package = "./generated_protos/roles_proto";

service RoleService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Get (GetRequest) returns (GetResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);

}

message Role {
    uint32 id = 1;
    string name = 2;
    string description = 3;
    string created_at = 4;
    optional string deleted_at = 5;
    optional bool is_active = 6;
    optional uint32 user_id = 7;
}

message CreateRequest {
    string name = 1;
    optional bool is_active = 2;
    string description = 3;
}

message CreateResponse {
    Role role = 1;
}

message GetRequest {
    uint32 id = 1;
}

message GetResponse {
    Role role = 1;
}

message ListRequest {
    optional uint32 limit = 1;
    optional uint32 offset = 2;
    optional string name = 3;
    optional string description = 4;
    optional bool is_active = 5;
    optional bool include_deleted = 6;
    optional OrderBy order_by = 7;
    optional uint32 user_id = 8;
}

message ListResponse {
    uint32 count = 1;
    repeated Role rows = 2;
}

message OrderBy {
    optional string id = 1;
    optional string created_at = 2;
    optional string name = 3;
}

message UpdateRequest {
    uint32 id = 1;
    optional string name = 2;
    optional string description = 3;
    optional bool is_active = 4;
}

message UpdateResponse {
    Role role = 1;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}