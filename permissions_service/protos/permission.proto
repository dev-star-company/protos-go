syntax = "proto3";

package permission_proto;

option go_package = "./generated_protos/permission_proto";

service PermissionService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Get (GetRequest) returns (GetResponse);
    rpc ListByIds (ListByIdsRequest) returns (ListByIdsResponse);
}

message Permission {
    uint32 id = 1;
    string created_at = 2;
    optional string deleted_at = 3;
    bool is_active = 4;
    string name = 5;
    string description = 6;
    string internal_name = 7;
    uint32 service_id = 8;
    uint32 role_id = 9;
}

message CreateRequest {
    string name = 1;
    string description = 2;
    string internal_name = 3;
    uint32 service_id = 4;
    bool is_active = 5;
}

message CreateResponse {
    bool is_active = 1;
    string name = 2;
    string description = 3;
    string internal_name = 4;
    uint32 service_id = 5;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message GetRequest {
    uint32 id = 1;
    uint32 limit = 2;
    uint32 offset = 3;
}

message GetResponse {
    bool is_active = 4;
    string name = 5;
    string description = 6;
    string internal_name = 7;
    uint32 service_id = 8;
}

message ListRequest {
    optional uint32 limit = 9;
    optional uint32 offset = 10;
    optional bool include_deleted = 11;
    optional OrderBy order_by = 12;
    optional string name = 13;
    optional string description = 14;
    optional string internal_name = 15;
    optional uint32 service_id = 16;
    optional bool is_active = 17;
    optional uint32 role_id = 18;
}

message ListByIdsRequest {
    repeated uint32 ids = 18;
}

message ListByIdsResponse {
    repeated Permission permissions = 19;
}

message OrderBy {
    optional string id = 20;
    optional string created_at = 21;
}

message ListResponse {
    repeated Permission rows = 22;
    uint32 count = 23;
}

message UpdateRequest {
    uint32 id = 24;
    optional string name = 25;
    optional string description = 26;
    optional string internal_name = 27;
    optional uint32 service_id = 28;
    optional bool is_active = 29;
}

message UpdateResponse {
    bool is_active = 30;
    string name = 31;
    string description = 32;
    string internal_name = 33;
    uint32 service_id = 34;
}