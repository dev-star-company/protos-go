syntax = "proto3";

package whatsapp_config_proto;

option go_package = "./generated_protos/whatsapp_config_proto";

service WhatsappConfigService {
    rpc Create (CreateRequest) returns (CreateResponse) {}
    rpc Get (GetRequest) returns (GetResponse) {}
    rpc Delete (DeleteRequest) returns (DeleteResponse) {}
    rpc List (ListRequest) returns (ListResponse) {}
}

message WhatsappConfigDto {
    optional uint32 user_id = 1;
    string phone_number = 2;
    string status = 3;
    string store_id = 4;
    uint32 id = 5;
}

message CreateRequest {
    optional uint32 user_id = 1;
    string phone_number = 2;
    string status = 3;
    string store_id = 4;
}

message CreateResponse {
    uint32 id = 5;
    optional uint32 user_id = 1;
    string phone_number = 2;
    string status = 3;
    string store_id = 4;
}

message GetRequest {
    uint32 user_id = 1;
}

message GetResponse {
    optional uint32 user_id = 1;
    string phone_number = 2;
    string status = 3;
    string store_id = 4;
    uint32 id = 5;
}

message DeleteRequest {
    uint32 user_id = 1;
}

message DeleteResponse {}

message ListRequest {
    optional int32 limit  = 1;
    optional int32 offset = 2;
}

message ListResponse {
    repeated WhatsappConfigDto rows = 1;
    int32 count = 2;
}
