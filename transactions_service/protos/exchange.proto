syntax = "proto3";

package exchange_proto;

option go_package = "./generated_protos/exchange_proto";

service ExchangeService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Exchange {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 4;
  double value = 8;
  uint32 currency_id = 9;
}

message CreateRequest {
  double value = 2;
  uint32 currency_id = 3;
}

message CreateResponse {
  double value = 1;
  uint32 currency_id = 2;
  string created_at = 3;
  string deleted_at = 5;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  double value = 1;
  uint32 currency_id = 2;
  string created_at = 3;
  string deleted_at = 5;
}

message UpdateRequest {
  uint32 id = 1;
  optional double value = 3;
  optional uint32 currency_id = 4;
}

message UpdateResponse {
  double value = 1;
  uint32 currency_id = 2;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional bool include_deleted = 3;
  optional double value = 4;
  optional uint32 currency_id = 5;
  optional OrderBy orderby = 6;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated Exchange rows = 1;
  uint32 count = 2;
}
