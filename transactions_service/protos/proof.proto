syntax = "proto3";

package proof_proto;

option go_package = "./generated_protos/proof_proto";

service ProofService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message Proof {
  uint32 id = 1;
  string created_at = 2;
  optional string deleted_at = 4;
  uint32 transaction_id = 8;
  string sender = 9;
  optional string observation = 10;
}

message CreateRequest {
  uint32 transaction_id = 2;
  string sender = 3;
  optional string observation = 4;
}

message CreateResponse {
  uint32 transaction_id = 1;
  string sender = 2;
  string observation = 3;
  string created_at = 4;
  string deleted_at = 6;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 transaction_id = 1;
  string sender = 2;
  string observation = 3;
  string created_at = 4;
  string deleted_at = 6;
}

message UpdateRequest {
  uint32 id = 1;
  optional uint32 transaction_id = 3;
  optional string sender = 4;
  optional string observation = 5;
}

message UpdateResponse {
  uint32 transaction_id = 1;
  string sender = 2;
  string observation = 3;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}

message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional bool include_deleted = 3;
  optional uint32 transaction_id = 4;
  optional string sender = 5;
  optional string observation = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}

message ListResponse {
  repeated Proof rows = 1;
  uint32 count = 2;
}
