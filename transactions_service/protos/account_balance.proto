syntax = "proto3";

package account_balance_proto;

option go_package = "./generated_protos/account_balance_proto";

service AccountBalanceService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message AccountBalance {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  optional string deleted_at = 4;
  uint32 created_by = 5;
  uint32 updated_by = 6;
  optional uint32 deleted_by = 7;
  uint32 account_id = 8;
  uint32 currency_id = 9;
  double balance = 10;
}

message CreateRequest {
  string requester_uuid = 1;
  uint32 account_id = 2;
  uint32 currency_id = 3;
  double balance = 4;
}

message CreateResponse {
  uint32 account_id = 1;
  uint32 currency_id = 2;
  double balance = 3;
  string created_at = 4;
  string updated_at = 5;
  string deleted_at = 6;
  uint32 created_by = 7;
  uint32 updated_by = 8;
  uint32 deleted_by = 9;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  uint32 id = 1;
  uint32 account_id = 2;
  uint32 currency_id = 3;
  double balance = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
  uint32 created_by = 8;
  uint32 updated_by = 9;
  uint32 deleted_by = 10;
}


message ListRequest {
  optional uint32 limit = 1;
  optional uint32 offset = 2;
  optional bool include_deleted = 3;
  optional uint32 account_id = 4;
  optional bool balance = 5;
  optional uint32 currency_id = 6;
  optional OrderBy orderby = 7;
}

message OrderBy {
  optional string id = 1;
  optional string created_at = 2;
}
  

message ListResponse {
  uint32 count = 1;
  repeated AccountBalance rows = 2;
}

message UpdateRequest {
  uint32 id = 1;
  string requester_uuid = 2;
  optional uint32 account_id = 3;
  optional uint32 currency_id = 4;
  optional double balance = 5;
}

message UpdateResponse {
  uint32 id = 1;
  uint32 account_id = 2;
  uint32 currency_id = 3;
  double balance = 4;
}

message DeleteRequest {
  uint32 id = 1;
  string requester_uuid = 2;
}

message DeleteResponse {
  string message = 1;
}

