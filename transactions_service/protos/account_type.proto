syntax = "proto3";

package account_type_proto;

option go_package = "./generated_protos/account_type_proto";

service AccountTypeService {
    rpc Create(CreateRequest) returns (CreateResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc List(ListRequest) returns (ListResponse);
    rpc Update(UpdateRequest) returns (UpdateResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
  }  

message AccountType {
  uint32 id = 1;
  string name = 2;
  string created_at = 5;
  optional string deleted_at = 7;
}

message CreateRequest {
  string name = 2;
}

message CreateResponse {
  string name = 1;
  string created_at = 4;
  string deleted_at = 6;
}

message GetRequest {
  uint32 id = 1;
}

message GetResponse {
  string name = 1;
  string created_at = 4;
  string deleted_at = 6;
}

message OrderBy {
  optional string name = 1;
  optional string id = 2;
  optional string created_at = 3;
}

message ListRequest {
  optional string name = 1;
  optional uint32 limit = 2;
  optional uint32 offset = 3;
  optional bool include_deleted = 4;
  optional OrderBy orderby = 5;
}

message ListResponse {
  repeated AccountType rows = 1;
  uint32 count = 2;
}

message UpdateRequest {
  uint32 id = 1;
  optional string name = 2;
}

message UpdateResponse {
  string name = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {
  string message = 1;
}