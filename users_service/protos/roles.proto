syntax = "proto3";

package roles_proto;

option go_package = "./generated_protos/roles_proto";

service RolesService {
    rpc Create (CreateRequest) returns (CreateResponse);
    rpc Get (GetRequest) returns (GetResponse);
    rpc List (ListRequest) returns (ListResponse);
    rpc Update (UpdateRequest) returns (UpdateResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);

    rpc AddPermission (AddPermissionRequest) returns (AddPermissionResponse);
    rpc RemovePermission (RemovePermissionRequest) returns (RemovePermissionResponse);
    rpc GetPermissions (GetPermissionsRequest) returns (GetPermissionsResponse);
}

message Permission {
    uint32 id = 1;
    string name = 2;
    string description = 3;
    string created_at = 4;
    optional string deleted_at = 5;
    bool is_active = 6;
    string permission = 7;
}

message Role {
    uint32 id = 1;
    string name = 2;
    string description = 3;
    string created_at = 4;
    optional string deleted_at = 5;
    bool is_active = 6;
}

message CreateRequest {
    string name = 1;
    string description = 2;
}

message CreateResponse {
    Role role = 1;
}

message GetRequest {
    uint32 id = 1;
}

message GetResponse {
    Role role = 1;
}

message ListRequest {
    uint32 limit = 1;
    uint32 offset = 2;
    optional bool include_deleted = 3;
}

message ListResponse {
    repeated Role rows = 1;
    int32 count = 2;
}

message UpdateRequest {
    uint32 id = 1;
    optional string name = 2;
    optional string description = 3;
}

message UpdateResponse {
    Role role = 1;
}

message DeleteRequest {
    uint32 id = 1;
}

message DeleteResponse {}

message AddPermissionRequest {
    uint32 role_id = 1;
    uint32 permission_id = 2;
}

message AddPermissionResponse {
    Role role = 3;
}

message RemovePermissionRequest {
    uint32 role_id = 4;
    uint32 permission_id = 5;
}

message RemovePermissionResponse {
    Role role = 6;
}

message GetPermissionsRequest {
    uint32 role_id = 7;
    uint32 limit = 8;
    uint32 offset = 9;
}

message GetPermissionsResponse {
    repeated Permission rows = 10;
    uint32 count = 11;
}