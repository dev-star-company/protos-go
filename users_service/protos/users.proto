syntax = "proto3";

package users_proto;

option go_package = "./generated_protos/users_proto";

service UsersService {
  rpc Create (CreateRequest) returns (CreateResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc List (ListRequest) returns (ListResponse);
  rpc Update (UpdateRequest) returns (UpdateResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
}

message Phone {
  uint32 id = 1;
  string phone = 2;
  string created_at = 3;
  optional string deleted_at = 4;
  bool main = 5;
}

message Email {
  uint32 id = 1;
  string email = 2;
  string created_at = 3;
  optional string deleted_at = 4;
  bool main = 5;
}

message User {
  uint32 id = 1;
  string name = 2;
  string surname = 3;
  repeated Email emails = 4;
  string created_at = 5;
  optional string deleted_at = 6;
  repeated Phone phones = 7;
}

message Relations {
  bool emails = 1;
  bool phones = 2;
  bool passwords = 3;
  bool roles = 4;
}

message CreateRequest {
  string name = 1;
  string surname = 2;
  string email = 3;
  // string password = 4;
  // string confirm_password = 5;
  string phone = 6;
}

message CreateResponse {
  User user = 1;
}


message GetRequest {
  string uuid = 1;
}

message GetResponse {
  User user = 1;
}

message ListRequest {
  optional uint32 id = 1;
  optional string email = 2;
  optional string name = 3;
  optional string surname = 4;
  uint32 limit = 5;
  uint32 offset = 6;
  optional bool include_deleted = 7;
  optional string phone = 8;
  optional Relations relations = 9;
}

message ListResponse {
  repeated User rows = 1;
  int32 count = 2;
}

message UpdateRequest {
  optional uint32 id = 1;
  optional string name = 2;
  optional string surname = 3;
  optional string email = 4;
  // optional string password = 5;
  // optional string confirm_password = 6;
  optional string phone = 7;
}

message UpdateResponse {
  User user = 1;
}

message DeleteRequest {
  uint32 id = 1;
}

message DeleteResponse {}